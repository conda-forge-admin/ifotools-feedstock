schema_version: 1

context:
  version: "1.0a10"

package:
  name: ifotools
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/i/ifotools/ifotools-${{ version }}.tar.gz
  sha256: 426dc96fcf575be9f67a8c8a026e9ac68804cc4f352d8766e079696b7936977b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0.3
    - setuptools-scm >=8
    - pip
  run:
    - python >=${{ python_min }}
    - sympy
    - pygments
    - finesse
    - tabulate

tests:
  - python:
      imports:
        - ifotools
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Collection of functions useful for simulating interferometers
  license: AGPL-3.0-only
  license_file: LICENSE
  homepage: https://pypi.org/project/ifotools/

extra:
  recipe-maintainers:
    - mironleon
